<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<!-- Plantilla de reporte de Matrícula Escolar (MEE-52). El asistente reemplaza las cuatro marcas (TITULO, BAJADA,
     LAMINAS_JS con el contenido de assets/laminas.js y REPORTE con el JSON del reporte), escritas entre dos guiones bajos
     a cada lado, y nada más. Este comentario las nombra sin los guiones a propósito: así un reemplazo de todas las
     apariciones no copia el JSON ni laminas.js aquí dentro (ronda 15, Desfase 6). -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"></script>
<style>
  :root { --fondo: #fbfaf7; --tinta: #1f2328; --suave: #5f5a50; --linea: #e6e1d8; --tarjeta: #ffffff; }
  /* Fondo claro también en modo oscuro: la paleta Okabe-Ito de las láminas está pensada sobre fondo claro. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
  header h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; }
  header p { color: var(--suave); margin: 0 0 22px; max-width: 70ch; }
  .hallazgo { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 18px 18px 14px;
              margin: 0 0 18px; }
  .hallazgo > p { margin: 0 0 12px; max-width: 72ch; }
  .lamina .ft { font-weight: 700; font-size: 1.05rem; }
  .lamina .fs { color: var(--suave); font-size: .92rem; margin: 2px 0 8px; }
  .lamina svg { max-width: 100%; height: auto; overflow: visible; }
  .lamina .leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; margin-top: 4px; }
  .lamina .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .lamina .nota { color: var(--suave); font-size: .85rem; margin-top: 6px; }
  .lamina .src { color: var(--suave); font-size: .8rem; font-style: italic; margin-top: 4px; }
  .no-implica { font-size: .85rem; color: var(--suave); border-left: 3px solid var(--linea); padding-left: 10px; margin-top: 10px; }
  .fuentes { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 18px; margin-top: 26px; }
  .fuentes h2 { font-size: 1.2rem; margin: 0 0 10px; }
  .fuentes dt { font-weight: 700; margin-top: 12px; }
  .fuentes dd { margin: 2px 0 0; }
  .fuentes dd ul { margin: 4px 0 0; padding-left: 20px; }
  .fuentes dd p { margin: 2px 0 0; }
  .fuentes .versiones { color: var(--suave); font-size: .8rem; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <header><h1>__TITULO__</h1><p>__BAJADA__</p></header>
  <div id="hallazgos"></div>
  <section id="fuentes"></section>
</main>
<script>
__LAMINAS_JS__
</script>
<script>
// REPORTE: { hallazgos: [{texto, lamina: {tipo: "serie"|"balance"|"barras", datos, opt}, no_implica?}], fuentes: {…} }
const REPORTE = __REPORTE__;
const raiz = document.getElementById("hallazgos");
REPORTE.hallazgos.forEach((h) => {
  const tarjeta = document.createElement("section");
  tarjeta.className = "hallazgo";
  if (h.texto) tarjeta.insertAdjacentHTML("beforeend", `<p>${h.texto}</p>`);
  const fig = document.createElement("div");
  tarjeta.append(fig);
  raiz.append(tarjeta);
  Laminas[h.lamina.tipo](fig, h.lamina.datos, h.lamina.opt);
  if (h.no_implica) tarjeta.insertAdjacentHTML("beforeend", `<div class="no-implica">${h.no_implica}</div>`);
});
Laminas.fuentes(document.getElementById("fuentes"), REPORTE.fuentes);
</script>
</body>
</html>
